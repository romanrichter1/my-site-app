<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexivo · Klientský dashboard</title>
  <link rel="icon" href="../assets/nexivo-favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #F5F3EE; }

    :root {
      --cream:    #F5F3EE;
      --cream-2:  #EDEAE0;
      --paper:    #FFFFFF;
      --ink:      #0A0A09;
      --ink-2:    #111111;
      --ink-3:    #1F1E18;
      --muted:    #6B6A5C;
      --muted-2:  #98968A;
      --hair:     rgba(10,10,9,0.08);
      --hair-2:   rgba(10,10,9,0.14);
      --hair-dk:  rgba(255,255,255,0.10);
      --hair-dk2: rgba(255,255,255,0.16);
      --lime:     #C7F230;
      --lime-dim: rgba(199,242,48,0.20);
      --font-display: 'Fraunces', Georgia, serif;
      --font-sans:    'Manrope', -apple-system, sans-serif;
    }

    * { -webkit-font-smoothing: antialiased; }

    /* ── APP SHELL ── */
    .app {
      width: 100vw; height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-sans);
      display: grid;
      grid-template-columns: 232px 1fr;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .side {
      height: 100%;
      display: flex; flex-direction: column;
      padding: 28px 20px 20px;
      border-right: 1px solid var(--hair);
      background: var(--cream);
    }
    .side__brand {
      display: inline-flex; align-items: flex-end; gap: 6px;
      font-family: var(--font-display); font-weight: 600;
      font-size: 28px; line-height: 1; letter-spacing: -0.022em;
      font-variation-settings: "opsz" 96;
      color: var(--ink);
      padding: 0 8px 28px;
      border-bottom: 1px solid var(--hair);
      cursor: pointer;
    }
    .side__brand::after { content: ""; width: 7px; height: 7px; background: var(--lime); margin-bottom: 6px; }
    .side__group { margin-top: 24px; display: flex; flex-direction: column; gap: 2px; }
    .side__cap {
      font: 600 11px/1 var(--font-sans);
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted-2);
      padding: 0 10px 10px;
    }
    .side__link {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      font: 500 14px/1 var(--font-sans);
      color: var(--ink);
      cursor: pointer;
      letter-spacing: -0.002em;
      transition: background 180ms cubic-bezier(0.16,1,0.3,1);
    }
    .side__link:hover { background: var(--cream-2); }
    .side__link svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .side__link--active { background: var(--ink); color: var(--cream); }
    .side__link--active:hover { background: var(--ink-2); }
    .side__link .meta {
      margin-left: auto;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      padding: 3px 7px; border-radius: 999px;
      background: var(--lime); color: var(--ink);
    }
    .side__foot { margin-top: auto; }
    .side__user {
      display: grid; grid-template-columns: 32px 1fr auto;
      align-items: center; gap: 10px;
      padding: 10px; border-radius: 10px;
      border: 1px solid var(--hair); background: var(--paper);
    }
    .side__avatar {
      width: 32px; height: 32px; border-radius: 999px;
      background: var(--ink); color: var(--cream);
      display: inline-flex; align-items: center; justify-content: center;
      font: 600 12px/1 var(--font-sans);
    }
    .side__who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .side__who .n { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side__who .r { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
    .side__user svg { width: 16px; height: 16px; stroke: var(--muted); stroke-width: 1.5; fill: none; }

    /* ── MAIN ── */
    .main { height: 100%; overflow: auto; display: flex; flex-direction: column; }
    .main::-webkit-scrollbar { display: none; }

    /* ── TOPBAR ── */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 48px 24px;
      border-bottom: 1px solid var(--hair);
      flex-shrink: 0;
    }
    .top__l { display: flex; flex-direction: column; gap: 6px; }
    .top__eyebrow {
      font: 600 11px/1 var(--font-sans);
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
      display: inline-flex; align-items: center; gap: 10px;
    }
    .top__eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--lime); }
    .top__hello {
      font-family: var(--font-display); font-weight: 400;
      font-size: 30px; line-height: 1.05; letter-spacing: -0.018em;
      font-variation-settings: "opsz" 72;
    }
    .top__hello em { font-style: italic; }
    .top__r { display: flex; align-items: center; gap: 14px; }
    .tabs {
      display: inline-flex;
      background: var(--paper);
      border: 1px solid var(--hair);
      border-radius: 999px;
      padding: 4px;
    }
    .tabs button {
      font: 600 13px/1 var(--font-sans);
      border: 0; background: transparent;
      padding: 9px 16px; border-radius: 999px;
      color: var(--muted); cursor: pointer;
      letter-spacing: -0.005em;
      transition: all 180ms cubic-bezier(0.16,1,0.3,1);
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button.on { background: var(--ink); color: var(--cream); }
    .topbtn {
      display: inline-flex; align-items: center; gap: 8px;
      font: 600 13px/1 var(--font-sans);
      padding: 11px 16px; border-radius: 8px;
      border: 1px solid var(--hair-2);
      background: var(--paper); color: var(--ink);
      cursor: pointer;
      transition: background 150ms;
    }
    .topbtn:hover { background: var(--cream-2); }
    .topbtn--ink { background: var(--ink); color: var(--cream); border-color: transparent; }
    .topbtn--ink:hover { background: var(--ink-3); }
    .topbtn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .topbtn .dot { width: 7px; height: 7px; background: var(--lime); border-radius: 999px; box-shadow: 0 0 0 3px rgba(199,242,48,0.30); }

    /* ── HERO ── */
    .hero {
      padding: 48px 48px 32px;
      display: grid; grid-template-columns: 1.35fr 1fr;
      gap: 56px; align-items: flex-end;
      flex-shrink: 0;
    }
    .hero__label {
      display: flex; align-items: center; gap: 12px;
      font: 600 12px/1 var(--font-sans);
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 20px;
    }
    .hero__label::before { content: ""; width: 7px; height: 7px; background: var(--lime); }
    .hero__num {
      font-family: var(--font-display); font-weight: 400;
      font-size: 232px; line-height: 0.86; letter-spacing: -0.038em;
      font-variation-settings: "opsz" 144; font-feature-settings: "tnum","lnum";
      color: var(--ink);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .hero__unit {
      font-family: var(--font-display); font-weight: 400;
      font-size: 52px; letter-spacing: -0.022em;
      margin-top: 30px; color: var(--muted);
    }
    .hero__caption { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; max-width: 480px; }
    .hero__caption p { font: 400 17px/1.5 var(--font-sans); color: var(--muted); }
    .hero__caption p em { font-style: normal; color: var(--ink); font-weight: 600; }
    .hero__delta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-radius: 999px;
      background: var(--lime-dim); color: var(--ink);
      font: 600 13px/1 var(--font-sans); align-self: flex-start;
    }
    .hero__delta svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
    .hero__side { display: flex; flex-direction: column; gap: 14px; }

    /* ── KPIs ── */
    .kpi {
      background: var(--paper); border-radius: 14px;
      padding: 22px 24px; border: 1px solid var(--hair);
      display: grid; grid-template-columns: 1fr auto;
      gap: 12px; align-items: end;
    }
    .kpi__label { font: 600 11px/1 var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .kpi__name { font: 500 14px/1.2 var(--font-sans); margin-top: 8px; color: var(--ink); }
    .kpi__num {
      font-family: var(--font-display); font-weight: 400;
      font-size: 56px; line-height: 1; letter-spacing: -0.028em;
      font-feature-settings: "tnum","lnum"; font-variation-settings: "opsz" 72;
      display: flex; align-items: baseline; gap: 4px; white-space: nowrap;
    }
    .kpi__num .u { font-size: 18px; color: var(--muted); letter-spacing: 0; margin-left: 2px; font-family: var(--font-sans); font-weight: 500; }
    .kpi__delta { font: 600 12px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 4px; color: #1F8A5B; }
    .kpi__delta--neg { color: #B85C1F; }
    .kpi__delta svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* ── SERVICE CARDS ── */
    .svcs { padding: 32px 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; flex-shrink: 0; }
    .svc-card {
      background: var(--ink-2); color: var(--cream);
      border-radius: 18px; padding: 28px 28px 24px;
      display: flex; flex-direction: column; gap: 16px;
      min-height: 280px; position: relative; overflow: hidden;
    }
    .svc-card__top { display: flex; align-items: center; justify-content: space-between; }
    .svc-card__name { display: inline-flex; align-items: center; gap: 10px; font: 600 13px/1 var(--font-sans); letter-spacing: 0.04em; }
    .svc-card__name .ic { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.06); display: inline-flex; align-items: center; justify-content: center; }
    .svc-card__name .ic svg { width: 16px; height: 16px; stroke: var(--cream); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .svc-card__live { display: inline-flex; align-items: center; gap: 6px; font: 600 10px/1 var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--lime); }
    .svc-card__live::before { content: ""; width: 6px; height: 6px; background: var(--lime); border-radius: 999px; box-shadow: 0 0 0 3px rgba(199,242,48,0.20); animation: livepulse 2s ease-in-out infinite; }
    @keyframes livepulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    .svc-card__big { margin-top: 12px; font-family: var(--font-display); font-weight: 400; font-size: 96px; line-height: 0.88; letter-spacing: -0.034em; font-feature-settings: "tnum","lnum"; font-variation-settings: "opsz" 96; }
    .svc-card__big .u { font-family: var(--font-sans); font-weight: 500; font-size: 18px; letter-spacing: 0; color: var(--muted-2); margin-left: 6px; }
    .svc-card__sub { font: 400 14px/1.45 var(--font-sans); color: rgba(245,243,238,0.65); max-width: 320px; }
    .svc-card__row { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--hair-dk); display: flex; justify-content: space-between; gap: 14px; }
    .svc-card__row .s { display: flex; flex-direction: column; gap: 4px; }
    .svc-card__row .lab { font: 600 10px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-2); }
    .svc-card__row .v { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: -0.014em; font-feature-settings: "tnum","lnum"; color: var(--cream); }
    .svc-card__row .v .u { font-family: var(--font-sans); font-size: 12px; color: var(--muted-2); font-weight: 500; margin-left: 2px; }
    .svc-card--featured::before { content: ""; position: absolute; top: 28px; right: 28px; width: 8px; height: 8px; background: var(--lime); }

    /* ── ANALYTICS ROW ── */
    .row2 { padding: 16px 48px 56px; display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; flex-shrink: 0; }
    .chartcard { background: var(--paper); border-radius: 16px; border: 1px solid var(--hair); padding: 28px; display: flex; flex-direction: column; gap: 22px; }
    .chartcard__head { display: flex; align-items: flex-start; justify-content: space-between; }
    .chartcard__title { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; letter-spacing: -0.014em; font-variation-settings: "opsz" 48; }
    .chartcard__title em { font-style: italic; }
    .chartcard__sub { font: 400 13px/1 var(--font-sans); color: var(--muted); margin-top: 6px; letter-spacing: 0.02em; }
    .chartcard__legend { display: flex; gap: 16px; }
    .chartcard__legend span { display: inline-flex; align-items: center; gap: 7px; font: 500 12px/1 var(--font-sans); color: var(--muted); }
    .chartcard__legend span::before { content: ""; width: 9px; height: 9px; }
    .chartcard__legend .l1::before { background: var(--ink); border-radius: 999px; }
    .chartcard__legend .l2::before { background: var(--lime); }
    .chart { position: relative; height: 260px; width: 100%; }
    .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .chart__xaxis { display: flex; justify-content: space-between; margin-top: 12px; font: 500 11px/1 var(--font-sans); color: var(--muted-2); letter-spacing: 0.04em; }
    .chartcard__foot { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid var(--hair); font: 500 13px/1 var(--font-sans); color: var(--muted); }
    .chartcard__foot strong { color: var(--ink); font-weight: 600; }

    /* ── ACTIVITY ── */
    .activity { background: var(--paper); border-radius: 16px; border: 1px solid var(--hair); padding: 28px; display: flex; flex-direction: column; gap: 20px; }
    .activity__head { display: flex; align-items: flex-start; justify-content: space-between; }
    .activity__title { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.1; letter-spacing: -0.014em; font-variation-settings: "opsz" 48; }
    .activity__title em { font-style: italic; }
    .activity__link { font: 600 12px/1 var(--font-sans); letter-spacing: -0.005em; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .activity__list { display: flex; flex-direction: column; gap: 4px; }
    .activity__item { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 14px; padding: 12px 6px; border-bottom: 1px solid var(--hair); }
    .activity__item:last-child { border-bottom: 0; }
    .activity__ic { width: 32px; height: 32px; border-radius: 999px; background: var(--cream-2); display: inline-flex; align-items: center; justify-content: center; }
    .activity__ic svg { width: 14px; height: 14px; stroke: var(--ink); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .activity__ic--lime { background: var(--lime); }
    .activity__txt { display: flex; flex-direction: column; gap: 2px; }
    .activity__what { font: 500 13px/1.3 var(--font-sans); color: var(--ink); }
    .activity__what .b { font-weight: 600; }
    .activity__when { font: 400 11px/1 var(--font-sans); color: var(--muted); letter-spacing: 0.02em; }
    .activity__val { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: -0.012em; font-feature-settings: "tnum","lnum"; color: var(--ink); }
    .activity__val .u { font-family: var(--font-sans); font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }

    /* ── DETAIL VIEW ── */
    .detail { padding: 36px 48px 48px; display: flex; flex-direction: column; gap: 28px; }
    .detail__crumb { display: inline-flex; align-items: center; gap: 8px; font: 600 12px/1 var(--font-sans); color: var(--muted); letter-spacing: 0.02em; }
    .detail__crumb svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.5; fill: none; }
    .detail__crumb b { color: var(--ink); font-weight: 600; }
    .detail__hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 56px; align-items: flex-end; }
    .detail__title { font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 1.05; letter-spacing: -0.022em; font-variation-settings: "opsz" 96; margin: 14px 0 0; max-width: 720px; }
    .detail__title em { font-style: italic; }
    .detail__statbig { font-family: var(--font-display); font-weight: 400; font-size: 168px; line-height: 0.86; letter-spacing: -0.036em; font-feature-settings: "tnum","lnum"; font-variation-settings: "opsz" 144; margin-top: 28px; }
    .detail__statbig .u { font-size: 32px; font-family: var(--font-sans); font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
    .detail__statsub { font: 500 16px/1.5 var(--font-sans); color: var(--muted); margin-top: 8px; max-width: 480px; }
    .detail__statsub em { font-style: normal; color: var(--ink); font-weight: 600; }
    .detail__rightcard { background: var(--ink-2); color: var(--cream); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 20px; min-height: 320px; }
    .detail__rightcard h4 { font: 600 11px/1 var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted-2); }
    .calldemo { display: flex; flex-direction: column; gap: 10px; }
    .calldemo .bub { padding: 11px 14px; border-radius: 12px; font: 400 14px/1.42 var(--font-sans); max-width: 86%; }
    .calldemo .bub--them { background: rgba(255,255,255,0.06); align-self: flex-start; border-bottom-left-radius: 4px; }
    .calldemo .bub--ai { background: var(--lime); color: var(--ink); align-self: flex-end; border-bottom-right-radius: 4px; }
    .calldemo .bub .ts { display: block; font-size: 10px; opacity: 0.55; margin-top: 4px; letter-spacing: 0.04em; }
    .detail__rightcard .row { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--hair-dk); display: flex; justify-content: space-between; align-items: center; font: 600 12px/1 var(--font-sans); }
    .detail__rightcard .row svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; }
    .toggle { display: inline-flex; align-items: center; background: var(--paper); border: 1px solid var(--hair); padding: 4px; border-radius: 999px; font: 600 12px/1 var(--font-sans); }
    .toggle button { background: transparent; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .toggle button svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.5; fill: none; }
    .toggle button.on { background: var(--lime); color: var(--ink); }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState } = React;

/* ── ICONS ── */
const Ico = {
  home:     () => <svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-4v-7H10v7H6a2 2 0 01-2-2z"/></svg>,
  phone:    () => <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>,
  chat:     () => <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>,
  globe:    () => <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>,
  bar:      () => <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,

/* ── CHART ── */
function SavingsChart() {
  const w = 700, h = 240, padX = 8, padY = 16;
  const pts = arr => {
    const max = Math.max(...arr), min = Math.min(...arr);
    const stepX = (w - padX*2) / (arr.length - 1);
    return arr.map((v, i) => [padX + i*stepX, h - padY - ((v-min)/(max-min))*(h-padY*2)]);
  };
  const seriesA = [3,4,3,5,4,6,5,7,6,8,7,9,8,11,9,10,12,11,13,12,14,13,15,14];
  const seriesB = [12,14,11,17,15,19,16,22,18,24,21,25,23,28,25,27,31,28,33,30,36,32,38,35];
  const a = pts(seriesA), b = pts(seriesB);
  const toPath = p => p.reduce((s,[x,y],i) => s+(i?' L ':' M ')+x.toFixed(1)+' '+y.toFixed(1),'');
  const areaPath = toPath(b)+' L '+(w-padX)+' '+(h-padY)+' L '+padX+' '+(h-padY)+' Z';
  return (
    <div className="chart">
      <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
        {[0.25,0.5,0.75].map((g,i) => <line key={i} x1={padX} x2={w-padX} y1={padY+g*(h-padY*2)} y2={padY+g*(h-padY*2)} stroke="rgba(10,10,9,0.06)" strokeWidth="1"/>)}
        <path d={areaPath} fill="rgba(199,242,48,0.16)"/>
        <path d={toPath(b)} fill="none" stroke="#C7F230" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round"/>
        <path d={toPath(a)} fill="none" stroke="#0A0A09" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" strokeDasharray="6 3"/>
      </svg>
    </div>
  );
}
